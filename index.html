<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mystile</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif;background:#121212;color:#fff;margin:0}.container{max-width:430px;margin:auto;background:#181818;min-height:100vh;padding-bottom:90px}.header{display:flex;justify-content:space-between;padding:20px}.logo{color:#7B61FF;font-size:30px;font-weight:800}.hero,.section{padding:20px}.search{margin:20px;background:#fff;border-radius:12px;padding:12px}.search input{width:100%;border:none;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px}.card,.product{background:#262626;border-radius:16px;padding:16px}.btn{background:#7B61FF;color:#fff;border:none;padding:14px;border-radius:12px;width:100%}.chars{display:flex;gap:12px;overflow:auto;padding:20px}.char{min-width:140px;background:#262626;border-radius:14px;overflow:hidden}.char img{width:100%;height:180px;object-fit:cover}.product{display:flex;gap:12px;align-items:center;margin:12px 20px}.product img{width:90px;height:90px;object-fit:cover;border-radius:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#111;padding:14px;display:flex;justify-content:space-around}</style></head><body><div class="container"><div class="header"><div class="logo">Mystile</div><div>👤</div></div><div class="hero"><h1>Dress Like Your Favourite Characters</h1><p>Upload a screenshot or describe an outfit.</p></div><div class="search"><input placeholder="Search character, movie or style..."></div><div class="grid"><div class="card">📷 Upload Screenshot</div><div class="card">✏️ Describe Outfit</div><div class="card">🔥 Trending Looks</div><div class="card">❤️ Wishlist</div></div><div class="section"><h2>Upload Photo</h2><input type="file" accept="image/png,image/jpeg,image/webp"></div><h2 style="padding:0 20px">Trending Characters</h2><div class="chars"><div class="char"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400"><p style="padding:10px">Emily</p></div><div class="char"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400"><p style="padding:10px">Tommy</p></div><div class="char"><img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?w=400"><p style="padding:10px">Beth</p></div></div><div class="section"><textarea style="width:100%;height:100px;border-radius:12px" placeholder="Describe outfit..."></textarea><button class="btn">Generate Look</button></div><div class="product"><img src="https://images.unsplash.com/photo-1523398002811-999ca8dec234?w=300"><div><h3>Leather Jacket</h3><p>£89</p></div></div><div class="product"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300"><div><h3>Chelsea Boots</h3><p>£120</p></div></div><div class="nav"><div>Home</div><div>Discover</div><div>Cart</div><div>Profile</div></div></div></body></html>
